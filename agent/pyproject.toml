[project]
name = "nakomis-fleet-agent"
version = "0.1.0"
description = "Raspberry Pi agent for nakomis-fleet: OTA releases over the Fleet MQTT protocol"
requires-python = ">=3.11"
dependencies = ["paho-mqtt>=2.1"]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-cov>=5"]

[project.scripts]
nakomis-fleet-agent = "fleet_agent.agent:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["fleet_agent"]

[tool.pytest.ini_options]
addopts = "--cov=fleet_agent --cov-report=term-missing --cov-fail-under=70"
