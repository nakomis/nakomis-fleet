name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Check out the post-merge state on PRs so CI validates what will land on main.
env:
  CHECKOUT_REF: ${{ github.event_name == 'pull_request' && format('refs/pull/{0}/merge', github.event.pull_request.number) || github.sha }}

# Never run two deploys of the same ref at once.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  id-token: write
  contents: read

jobs:
  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.CHECKOUT_REF }}
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: '25'
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  infra:
    name: Infra
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.CHECKOUT_REF }}
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: infra/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: '25'
          cache: pnpm
          cache-dependency-path: infra/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  deploy-infra-sandbox:
    needs: [web, infra]
    if: github.event_name != 'pull_request'
    uses: nakomis/nakomis-workflows/.github/workflows/cdk-deploy.yml@main
    with:
      environment: sandbox
      aws-role-arn: arn:aws:iam::975050268859:role/nakomis-nakomis-fleet-github-ci-sandbox
      command: pnpm ci-deploy-sandbox

  deploy-web-sandbox:
    needs: [deploy-infra-sandbox]
    uses: nakomis/nakomis-workflows/.github/workflows/deploy-static.yml@main
    with:
      environment: sandbox
      aws-role-arn: arn:aws:iam::975050268859:role/nakomis-nakomis-fleet-github-ci-sandbox
      working-directory: web
      ssm-bucket-param: /nakomis-shell/sandbox/bucket-name
      ssm-distribution-param: /nakomis-shell/sandbox/distribution-id
      prefix: remotes/fleet
      invalidation-paths: /remotes/fleet/*

  deploy-infra-prod:
    needs: [deploy-web-sandbox]
    uses: nakomis/nakomis-workflows/.github/workflows/cdk-deploy.yml@main
    with:
      environment: production
      aws-role-arn: arn:aws:iam::637423226886:role/nakomis-nakomis-fleet-github-ci-prod
      command: pnpm ci-deploy-prod

  deploy-web-prod:
    needs: [deploy-infra-prod]
    uses: nakomis/nakomis-workflows/.github/workflows/deploy-static.yml@main
    with:
      environment: production
      aws-role-arn: arn:aws:iam::637423226886:role/nakomis-nakomis-fleet-github-ci-prod
      working-directory: web
      ssm-bucket-param: /nakomis-shell/prod/bucket-name
      ssm-distribution-param: /nakomis-shell/prod/distribution-id
      prefix: remotes/fleet
      invalidation-paths: /remotes/fleet/*
